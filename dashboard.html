<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js'></script>
    <head>
        <link rel='stylesheet' href='styles.css'>
    </head>
</head>
<body>
    <h1>Supplier Performance Dashboard</h1>

   
    <h2>TOP 10 SUPPLIERS</h2>
    <div id='kpiContainer'></div>
    
    

    <select id='monthSelector'></select>

    <div id='supplierTableContainer'></div>

    <h1>Optimized Supplier Analytics</h1>

    <div id='supplierChartContainer'>
        <div div class='supplierChartContainerBox'><canvas id='supplierChart1'></canvas></div>
        <div class='supplierChartContainerBox'><canvas id='supplierChart2'></canvas></div>
        <div class='supplierChartContainerBox'><canvas id='supplierChart3'></canvas></div>
        <div class='supplierChartContainerBox'><canvas id='supplierChart4'></canvas></div>

    </div>

    <script>
        
        Papa.parse('supplier_performance_granular.csv', {
            download:true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
               


                showMonthDropdown(results.data);

                const selectedMonth = document.getElementById('monthSelector') .value;
                updateDashboard(results.data, selectedMonth);

                document.getElementById('monthSelector').addEventListener('change', function() {
                    updateDashboard(results.data, this.value);
                });


            },
            error: function(err) {
                console.error('Parse err');
                document.getElementById('output').innerText = 'Error loading CSV';
            }
        });
    

        function showMonthDropdown(data) {
            const months = [...new Set(data.map(row => row['reporting_month']))].sort();
            const selector = document.getElementById('monthSelector');

            selector.innerHTML = months.map(month =>
                `<option value= '${month}'>${month}</option>`
            ).join('');
        }

        function updateDashboard(data, selectedMonth) {

    const KpiHeaders = {
        supplier_name: [
            {label: 'Supplier', key: 'supplier_name' },
            {label: 'Orders Received', key: 'orders_received'},
            {label: 'On Time Orders', key: 'order_status'}
        ],

        received_quantity: 'Orders Received',
        rejected_quantity: 'Orders Rejected', 
        returned_quantity: 'Orders Returned',
    

};

    KpiHeadersCards(data, KpiHeaders);

    showStatusChart('supplierChart1', data, 'order_status', 'Order Status');
    showStatusChart('supplierChart2', data, 'line_status', 'Line Status');
    showStatusChart('supplierChart3', data, 'invoice_status', 'Invoice Status');
    showStatusChart('supplierChart4', data, 'unit_of_measure', 'Unit');

    const top20 = getTop20BySupplier(data, selectedMonth);
    renderSupplierTable(top20);
    }

        function KpiHeadersCards ( data) {
            const cardContainer = document.getElementById('kpiContainer');
            const supplierCounts = {};

            data.forEach(row => {
                if (!row.supplier_name || !row.order_status) return;

                const isDelivered = row.order_status.toLowerCase() === 'delivered';
                const isOnTime = row.delivery_date === row.promised_date;

                if (isDelivered && isOnTime) {
                    supplierCounts[row.supplier_name] = (supplierCounts[row.supplier_name] || 0) + 1;
                }
            });

            const sortedSuppliers = Object.keys(supplierCounts).map(name => {
                return {
                    name: name, 
                    onTimeCount: supplierCounts[name]
                };
            }).sort((a, b) => b.onTimeCount - a.onTimeCount);

            const top8 = sortedSuppliers.slice(0, 10);

            let cardsHtml = '';
            top8.forEach((supplier, index) => {
                cardsHtml += `
                <div class='kpiCard topSupplierCard'>
                    <span class='rankBadge'>#${index + 1}</span>
                    <h3>${supplier.name}</h3>
                    <p><strong>${supplier.onTimeCount}</strong> On Time Deliveries</p>
                    </div>
                    `;
            });

            cardContainer.innerHTML = cardsHtml;

        }

        function getStatusCounts(data, column) {
            const counts = {};
            data.forEach(row => {
                const value = row[column] || 'Unknown';
                counts [value] = (counts[value] || 0) + 1;
            });
            return counts;
        }

        
        let chartView = {};

        function showStatusChart (canvasId, data, column, title) {
            const counts = getStatusCounts(data, column);
            const labels = Object.keys(counts);
            const values = Object.values(counts);

            if (chartView[canvasId]) {
                chartView[canvasId].destroy();
            }

            chartView[canvasId] = new Chart(document.getElementById(canvasId), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data:values,
                        backgroundColor: ['green', 'orange', 'blue', 'red', 'yellow', 'pink']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display:true,
                            text: title
                        }
                    }
                }
            })
        }


        function getSupplierMetrics(data, reportingMonth) {
            const filtered = data.filter (row => row['reporting_month'] === reportingMonth);
            const suppliers = {};

            filtered.forEach(row => {
                const name = row['supplier_name'] || 'Unknown Supplier';
                const tier = row['supplier_tier'] || 'Unknown Tier';

                if (!suppliers[name]) {
                    suppliers[name] ={
                        supplier_name: name,
                        supplier_tier: tier,
                        onTimeCount: 0
                       
                    };
                }

                suppliers[name].totalOrders +1;
                const promisedDate = row['promised_delivery_date'];
                const actualDate = row['actual_delivery_date'];

                if (row['promised_delivery_date'] === row['actual_delivery_date']) {
                    suppliers[name].onTimeCount += 1;
                }
            });
            return suppliers;
        }






        function getTop20BySupplier(data, reportingMonth) {
            const metrics = getSupplierMetrics(data, reportingMonth);

            return Object.entries(metrics)
            .map(([name, values]) => ({ supplier_name: name, ...values }))
            .sort((a, b) => b.onTimeCount - a.onTimeCount)
            .slice(0,20);
        }


    function renderSupplierTable(top20) {
    const container = document.getElementById('supplierTableContainer');

    const columns = {
        supplier_name: 'Supplier',
        supplier_tier: 'Supplier Tier',
        onTimeCount: 'On-Time Orders',
    };

    const headerRow = Object.values(columns).map(label => `<th>${label}</th>`).join('');

    const bodyRows = top20.map(supplier =>
        `<tr>${Object.keys(columns).map(key => `<td>${supplier[key]}</td>`).join('')}</tr>`
    ).join('');

    container.innerHTML = `
        <table border="1" cellpadding="5">
            <thead><tr>${headerRow}</tr></thead>
            <tbody>${bodyRows}</tbody>
        </table>
    `;
}

    </script>
    
</body>
</html>
